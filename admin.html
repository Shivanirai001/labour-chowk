<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel – Labour Chowk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans', sans-serif; }
    .brand { font-family: 'Baloo 2', cursive; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- LOGIN -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow p-8 w-full max-w-sm">
      <p class="brand text-2xl font-bold text-orange-600 text-center mb-1">🏗️ Labour Chowk</p>
      <p class="text-center text-gray-500 text-sm mb-6">Admin Login</p>
      <input type="password" id="adminPass"
        class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-orange-400 mb-3"
        placeholder="Enter admin password"/>
      <button onclick="adminLogin()"
        class="w-full bg-orange-500 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-orange-600 transition">
        Login
      </button>
      <p id="loginError" class="text-red-500 text-xs text-center mt-2 hidden">Wrong password.</p>
      <p class="text-xs text-gray-400 text-center mt-4">Default password: <code>admin123</code></p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <nav class="bg-white shadow-sm px-4 py-3 flex items-center justify-between">
      <span class="brand text-xl font-bold text-orange-600">🏗️ Admin Panel</span>
      <div class="flex gap-3">
        <a href="index.html" target="_blank" class="text-sm text-gray-600 hover:text-orange-600 px-3 py-1.5 rounded-lg hover:bg-orange-50 transition">View Site ↗</a>
        <button onclick="adminLogout()" class="text-sm text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg transition">Logout</button>
      </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">

      <!-- STATS -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-xl p-4 shadow-sm text-center">
          <p class="text-2xl font-bold text-orange-500" id="statTotal">–</p>
          <p class="text-xs text-gray-500 mt-1">Total Registered</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm text-center">
          <p class="text-2xl font-bold text-yellow-500" id="statPending">–</p>
          <p class="text-xs text-gray-500 mt-1">Pending Approval</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm text-center">
          <p class="text-2xl font-bold text-green-500" id="statApproved">–</p>
          <p class="text-xs text-gray-500 mt-1">Approved & Live</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm text-center">
          <p class="text-2xl font-bold text-blue-500" id="statAvailable">–</p>
          <p class="text-xs text-gray-500 mt-1">Available Now</p>
        </div>
      </div>

      <!-- TABS -->
      <div class="flex gap-2 mb-6">
        <button onclick="showTab('pending')"  id="tabPending"  class="px-4 py-2 text-sm rounded-lg font-medium bg-orange-100 text-orange-700">⏳ Pending</button>
        <button onclick="showTab('approved')" id="tabApproved" class="px-4 py-2 text-sm rounded-lg font-medium text-gray-600 hover:bg-gray-100">✅ Approved</button>
        <button onclick="showTab('all')"      id="tabAll"      class="px-4 py-2 text-sm rounded-lg font-medium text-gray-600 hover:bg-gray-100">All Workers</button>
      </div>

      <!-- TABLE -->
      <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-gray-600">
            <tr>
              <th class="px-4 py-3 text-left font-medium">Name</th>
              <th class="px-4 py-3 text-left font-medium">Skill</th>
              <th class="px-4 py-3 text-left font-medium hidden sm:table-cell">Area</th>
              <th class="px-4 py-3 text-left font-medium hidden md:table-cell">Phone</th>
              <th class="px-4 py-3 text-left font-medium">Status</th>
              <th class="px-4 py-3 text-left font-medium">Actions</th>
            </tr>
          </thead>
          <tbody id="workerTable" class="divide-y divide-gray-100">
            <tr><td colspan="6" class="text-center py-8 text-gray-400">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Supabase -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    import { SUPABASE_URL, SUPABASE_KEY } from './firebase-config.js';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    window._supabase = supabase;
  </script>

  <script>
    const ADMIN_PASSWORD = 'admin123'; // ← Change this!
    let allWorkers = [];
    let currentTab = 'pending';

    function adminLogin() {
      if (document.getElementById('adminPass').value === ADMIN_PASSWORD) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadWorkers();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }
    window.adminLogin = adminLogin;
    document.getElementById('adminPass').addEventListener('keydown', e => {
      if (e.key === 'Enter') adminLogin();
    });

    function adminLogout() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
    }
    window.adminLogout = adminLogout;

    async function loadWorkers() {
      try {
        if (window._supabase) {
          const { data, error } = await window._supabase
            .from('workers')
            .select('*')
            .order('id', { ascending: false });
          if (!error && data) allWorkers = data;
        }
      } catch(e) { console.error(e); }
      updateStats();
      renderTable(currentTab);
    }

    function updateStats() {
      document.getElementById('statTotal').textContent     = allWorkers.length;
      document.getElementById('statPending').textContent   = allWorkers.filter(w => !w.approved).length;
      document.getElementById('statApproved').textContent  = allWorkers.filter(w =>  w.approved).length;
      document.getElementById('statAvailable').textContent = allWorkers.filter(w =>  w.available && w.approved).length;
    }

    function showTab(tab) {
      currentTab = tab;
      ['pending','approved','all'].forEach(t => {
        const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
        btn.className = t === tab
          ? 'px-4 py-2 text-sm rounded-lg font-medium bg-orange-100 text-orange-700'
          : 'px-4 py-2 text-sm rounded-lg font-medium text-gray-600 hover:bg-gray-100';
      });
      renderTable(tab);
    }
    window.showTab = showTab;

    function renderTable(tab) {
      const workers = allWorkers.filter(w =>
        tab === 'pending'  ? !w.approved :
        tab === 'approved' ?  w.approved : true
      );
      const tbody = document.getElementById('workerTable');
      if (workers.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-gray-400">No workers here.</td></tr>`;
        return;
      }
      tbody.innerHTML = workers.map(w => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3 font-medium text-gray-900">${w.name}</td>
          <td class="px-4 py-3 text-gray-600">${w.skill}</td>
          <td class="px-4 py-3 text-gray-600 hidden sm:table-cell">${w.area}</td>
          <td class="px-4 py-3 hidden md:table-cell">
            <a href="tel:${w.phone}" class="text-orange-600 hover:underline">${w.phone}</a>
          </td>
          <td class="px-4 py-3">
            <span class="px-2.5 py-1 rounded-full text-xs font-medium
              ${w.approved ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
              ${w.approved ? '✅ Approved' : '⏳ Pending'}
            </span>
          </td>
          <td class="px-4 py-3">
            <div class="flex gap-2">
              ${!w.approved ? `
                <button onclick="approveWorker('${w.id}')"
                  class="text-xs bg-green-500 text-white px-3 py-1.5 rounded-lg hover:bg-green-600 transition">
                  Approve
                </button>` : ''}
              <button onclick="removeWorker('${w.id}')"
                class="text-xs bg-red-50 text-red-500 border border-red-200 px-3 py-1.5 rounded-lg hover:bg-red-100 transition">
                Remove
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function approveWorker(id) {
      try {
        if (window._supabase) {
          await window._supabase.from('workers').update({ approved: true }).eq('id', id);
        }
        allWorkers = allWorkers.map(w => w.id === id ? { ...w, approved: true } : w);
        updateStats();
        renderTable(currentTab);
      } catch(e) { alert('Error approving worker.'); }
    }
    window.approveWorker = approveWorker;

    async function removeWorker(id) {
      if (!confirm('Remove this worker?')) return;
      try {
        if (window._supabase) {
          await window._supabase.from('workers').delete().eq('id', id);
        }
        allWorkers = allWorkers.filter(w => w.id !== id);
        updateStats();
        renderTable(currentTab);
      } catch(e) { alert('Error removing worker.'); }
    }
    window.removeWorker = removeWorker;
  </script>
</body>
</html>
